name: Deploy tested ApplyWise release

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Successful Validate release workflow run ID from master
        required: true
        type: string
      rollback_run_id:
        description: Earlier successful Validate release run ID used for automatic binary rollback
        required: true
        type: string
      production_origin:
        description: Canonical HTTPS origin that must serve the deployed release
        required: true
        default: https://applywise.runasp.net
        type: string
      database_backup_reference:
        description: Recoverable pre-migration database backup identifier
        required: true
        type: string
      production_environment_is_configured:
        description: Confirm host secrets, private storage, TLS, monitoring, and proxy settings are configured
        required: true
        default: false
        type: boolean
      release_migration_is_applied:
        description: Confirm the reviewed migrations.sql from release_run_id was applied after the referenced backup
        required: true
        default: false
        type: boolean
      release_migration_is_backward_compatible:
        description: Confirm schema compatibility with the rollback binary and acknowledge every reviewed data invalidation
        required: true
        default: false
        type: boolean
      bootstrap_first_hardened_release:
        description: First hardened rollout only—waive the live rollback-SHA match after staging two distinct baseline artifacts
        required: true
        default: false
        type: boolean
      bootstrap_approval_reference:
        description: Required in bootstrap mode—change ticket or approval reference reviewed by the production environment approver
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: applywise-monster-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: windows-latest
    timeout-minutes: 25
    environment: production

    steps:
      - name: Validate release and rollback identities
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          INPUT_ROLLBACK_RUN_ID: ${{ inputs.rollback_run_id }}
          MONSTER_WEBSITE_NAME: ${{ secrets.MONSTER_SERVER_USERNAME }}
          INPUT_PRODUCTION_ORIGIN: ${{ inputs.production_origin }}
          INPUT_DATABASE_BACKUP_REFERENCE: ${{ inputs.database_backup_reference }}
          INPUT_ENVIRONMENT_CONFIRMED: ${{ inputs.production_environment_is_configured }}
          INPUT_MIGRATION_APPLIED: ${{ inputs.release_migration_is_applied }}
          INPUT_MIGRATION_COMPATIBLE: ${{ inputs.release_migration_is_backward_compatible }}
          INPUT_BOOTSTRAP: ${{ inputs.bootstrap_first_hardened_release }}
          INPUT_BOOTSTRAP_APPROVAL: ${{ inputs.bootstrap_approval_reference }}
        run: |
          if ($env:INPUT_ENVIRONMENT_CONFIRMED -ne "true" -or
              $env:INPUT_MIGRATION_APPLIED -ne "true" -or
              $env:INPUT_MIGRATION_COMPATIBLE -ne "true") {
            throw "All production, migration, and rollback-compatibility confirmations must be explicitly accepted."
          }
          if ($env:INPUT_BOOTSTRAP -eq "true" -and
              ([string]::IsNullOrWhiteSpace($env:INPUT_BOOTSTRAP_APPROVAL) -or
               $env:INPUT_BOOTSTRAP_APPROVAL.Length -gt 256)) {
            throw "Bootstrap mode requires a bounded production change-ticket or approval reference."
          }
          $releaseRunId = 0L
          $rollbackRunId = 0L
          if (-not [long]::TryParse($env:INPUT_RELEASE_RUN_ID, [ref]$releaseRunId) -or
              -not [long]::TryParse($env:INPUT_ROLLBACK_RUN_ID, [ref]$rollbackRunId)) {
            throw "Release and rollback workflow run IDs must be positive integers."
          }
          if ($releaseRunId -le 0 -or $rollbackRunId -le 0 -or $releaseRunId -eq $rollbackRunId) {
            throw "Choose distinct positive release and rollback workflow run IDs."
          }
          if ($env:MONSTER_WEBSITE_NAME -notmatch '^[A-Za-z0-9.-]+$') {
            throw "The Monster website name contains unsupported characters."
          }
          $origin = $null
          if (-not [Uri]::TryCreate($env:INPUT_PRODUCTION_ORIGIN, [UriKind]::Absolute, [ref]$origin) -or
              $origin.Scheme -ne "https" -or $origin.UserInfo -or
              $origin.AbsolutePath -ne "/" -or $origin.Query -or $origin.Fragment) {
            throw "production_origin must be a canonical HTTPS origin without credentials, a path, query, or fragment."
          }
          if ([string]::IsNullOrWhiteSpace($env:INPUT_DATABASE_BACKUP_REFERENCE) -or
              $env:INPUT_DATABASE_BACKUP_REFERENCE.Length -gt 256) {
            throw "A recoverable database backup identifier is required."
          }

          function Get-ValidatedRun([long]$runId) {
            $json = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$runId"
            if ($LASTEXITCODE -ne 0) { throw "Unable to read workflow run $runId." }
            $run = $json | ConvertFrom-Json
            if ($run.path -ne ".github/workflows/ci.yml" -or
                $run.name -ne "Validate release" -or
                $run.conclusion -ne "success" -or
                $run.event -notin @("push", "workflow_dispatch") -or
                ($run.event -eq "push" -and $run.head_branch -ne "master")) {
              throw "Run $runId is not an allowed successful Validate release run. Pull-request artifacts are never deployable."
            }
            return [pscustomobject]@{
              headSha = $run.head_sha
              headBranch = $run.head_branch
              event = $run.event
            }
          }

          $release = Get-ValidatedRun $releaseRunId
          $rollback = Get-ValidatedRun $rollbackRunId
          if ($release.headSha -notmatch '^[a-fA-F0-9]{40}$' -or
              $rollback.headSha -notmatch '^[a-fA-F0-9]{40}$' -or
              $release.headSha -eq $rollback.headSha) {
            throw "The release and rollback runs must identify distinct valid commits."
          }
          $masterSha = gh api "repos/$env:GITHUB_REPOSITORY/commits/master" --jq .sha
          if ($LASTEXITCODE -ne 0 -or $masterSha -notmatch '^[a-fA-F0-9]{40}$') {
            throw "Unable to resolve the repository's current master commit."
          }
          foreach ($candidate in @($release, $rollback)) {
            $reachability = gh api "repos/$env:GITHUB_REPOSITORY/compare/$($candidate.headSha)...$masterSha" --jq .status
            if ($LASTEXITCODE -ne 0 -or $reachability -notin @("ahead", "identical")) {
              throw "Validated commit $($candidate.headSha) is not reachable from the repository's current master branch."
            }
          }
          $comparison = gh api "repos/$env:GITHUB_REPOSITORY/compare/$($rollback.headSha)...$($release.headSha)" --jq .status
          if ($LASTEXITCODE -ne 0 -or $comparison -ne "ahead") {
            throw "The rollback commit must be an ancestor of the release commit."
          }
          "RELEASE_SHA=$($release.headSha)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ROLLBACK_SHA=$($rollback.headSha)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PRODUCTION_ORIGIN=$($origin.GetLeftPart([UriPartial]::Authority).TrimEnd('/'))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BOOTSTRAP_RELEASE=$env:INPUT_BOOTSTRAP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check out deployment recovery scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download the tested release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: applywise-release
          path: .artifacts/release
          github-token: ${{ github.token }}
          run-id: ${{ inputs.release_run_id }}

      - name: Download the tested rollback artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: applywise-release
          path: .artifacts/rollback
          github-token: ${{ github.token }}
          run-id: ${{ inputs.rollback_run_id }}

      - name: Locate and validate release and rollback payloads
        shell: pwsh
        run: |
          function Get-ValidatedPayload(
              [string]$root,
              [string]$expectedCommit,
              [string]$label) {
            $dll = Get-ChildItem -LiteralPath $root -Filter "ApplyWise.Web.dll" -File -Recurse |
              Select-Object -First 1
            if ($null -eq $dll) { throw "The $label artifact does not contain ApplyWise.Web.dll." }
            $publishPath = $dll.Directory.FullName
            if (-not (Test-Path -LiteralPath (Join-Path $publishPath "web.config"))) {
              throw "The $label artifact does not contain a deployable web.config."
            }
            $manifestPath = Join-Path $publishPath "release-manifest.json"
            if (-not (Test-Path -LiteralPath $manifestPath)) {
              throw "The $label artifact predates the required security baseline."
            }
            $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
            if ($manifest.commit -ne $expectedCommit -or
                $manifest.securityBaseline -ne "2026-08-release-hardening-v2" -or
                $manifest.migrationSha256 -notmatch '^[a-f0-9]{64}$' -or
                $manifest.payloadSha256 -notmatch '^[a-f0-9]{64}$' -or
                $manifest.schemaMigration -notmatch '^[0-9]{14}_[A-Za-z0-9_]+$') {
              throw "The $label artifact provenance or security baseline is invalid."
            }
            $migrationFiles = @(
              Get-ChildItem -LiteralPath $root -Filter "migrations.sql" -File -Recurse)
            if ($migrationFiles.Count -ne 1) {
              throw "The $label artifact must contain exactly one migrations.sql file."
            }
            $actualMigrationHash = (Get-FileHash -LiteralPath $migrationFiles[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualMigrationHash -ne $manifest.migrationSha256) {
              throw "The $label migration artifact does not match its provenance manifest."
            }
            [string[]]$payloadEntries = @(Get-ChildItem -LiteralPath $publishPath -File -Recurse |
              Where-Object { $_.Name -ne "release-manifest.json" } |
              ForEach-Object {
                $relativePath = [IO.Path]::GetRelativePath($publishPath, $_.FullName).Replace('\', '/').ToLowerInvariant()
                $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
                "$hash ./$relativePath"
              })
            [Array]::Sort($payloadEntries, [StringComparer]::Ordinal)
            $payloadMaterial = ($payloadEntries -join "`n") + "`n"
            $actualPayloadHash = [Convert]::ToHexString(
              [Security.Cryptography.SHA256]::HashData(
                [Text.Encoding]::UTF8.GetBytes($payloadMaterial))).ToLowerInvariant()
            if ($actualPayloadHash -ne $manifest.payloadSha256) {
              throw "The $label publish payload does not match its provenance manifest."
            }
            $workspacePath = (Resolve-Path -LiteralPath $env:GITHUB_WORKSPACE).Path
            $deployPath = [IO.Path]::GetRelativePath($workspacePath, $publishPath).Replace('\', '/')
            if ([IO.Path]::IsPathRooted($deployPath) -or
                $deployPath -eq ".." -or
                $deployPath.StartsWith("../", [StringComparison]::Ordinal)) {
              throw "The $label publish payload must be located inside GITHUB_WORKSPACE."
            }
            $resolvedDeployPath = (Resolve-Path -LiteralPath (Join-Path $workspacePath $deployPath)).Path
            if (-not [string]::Equals($resolvedDeployPath, $publishPath, [StringComparison]::OrdinalIgnoreCase)) {
              throw "The $label relative deployment path does not resolve to its validated payload."
            }
            return [pscustomobject]@{
              PublishPath = $publishPath
              DeployPath = $deployPath
              MigrationSha256 = $manifest.migrationSha256
              PayloadSha256 = $manifest.payloadSha256
              SchemaMigration = $manifest.schemaMigration
            }
          }

          $releasePayload = Get-ValidatedPayload ".artifacts/release" $env:RELEASE_SHA "release"
          $rollbackPayload = Get-ValidatedPayload ".artifacts/rollback" $env:ROLLBACK_SHA "rollback"
          "RELEASE_PUBLISH_PATH=$($releasePayload.PublishPath)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_DEPLOY_PATH=$($releasePayload.DeployPath)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_MIGRATION_SHA256=$($releasePayload.MigrationSha256)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_PAYLOAD_SHA256=$($releasePayload.PayloadSha256)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_SCHEMA_MIGRATION=$($releasePayload.SchemaMigration)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ROLLBACK_PUBLISH_PATH=$($rollbackPayload.PublishPath)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ROLLBACK_DEPLOY_PATH=$($rollbackPayload.DeployPath)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ROLLBACK_MIGRATION_SHA256=$($rollbackPayload.MigrationSha256)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ROLLBACK_SCHEMA_MIGRATION=$($rollbackPayload.SchemaMigration)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Apply protected Google sign-in runtime configuration
        shell: pwsh
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.APPLYWISE_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.APPLYWISE_GOOGLE_CLIENT_SECRET }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GOOGLE_CLIENT_ID) -or
              $env:GOOGLE_CLIENT_ID -notmatch '^[0-9]+-[a-z0-9]+\.apps\.googleusercontent\.com$') {
            throw "The production Google OAuth client ID is missing or malformed."
          }
          if ([string]::IsNullOrWhiteSpace($env:GOOGLE_CLIENT_SECRET) -or
              $env:GOOGLE_CLIENT_SECRET.Length -gt 512) {
            throw "The production Google OAuth client secret is missing or malformed."
          }

          function Set-GoogleRuntimeConfiguration([string]$publishPath) {
            $webConfigPath = Join-Path $publishPath "web.config"
            [xml]$document = Get-Content -LiteralPath $webConfigPath -Raw
            $aspNetCore = $document.configuration.location.'system.webServer'.aspNetCore
            if ($null -eq $aspNetCore) {
              throw "The validated publish payload does not contain the expected ASP.NET Core web.config node."
            }

            $environmentVariables = $aspNetCore.environmentVariables
            if ($null -eq $environmentVariables) {
              $environmentVariables = $document.CreateElement("environmentVariables")
              [void]$aspNetCore.AppendChild($environmentVariables)
            }

            $runtimeValues = [ordered]@{
              "Google__ClientId" = $env:GOOGLE_CLIENT_ID
              "Google__ClientSecret" = $env:GOOGLE_CLIENT_SECRET
              "Google__GmailImportEnabled" = "true"
              "Google__GmailAutoSyncEnabled" = "true"
              "Google__GmailSyncIntervalMinutes" = "5"
            }
            foreach ($entry in $runtimeValues.GetEnumerator()) {
              $node = @($environmentVariables.environmentVariable) |
                Where-Object { $_.name -eq $entry.Key } |
                Select-Object -First 1
              if ($null -eq $node) {
                $node = $document.CreateElement("environmentVariable")
                [void]$environmentVariables.AppendChild($node)
              }
              $node.SetAttribute("name", $entry.Key)
              $node.SetAttribute("value", $entry.Value)
            }

            $writerSettings = [Xml.XmlWriterSettings]::new()
            $writerSettings.Encoding = [Text.UTF8Encoding]::new($false)
            $writerSettings.Indent = $true
            $writer = [Xml.XmlWriter]::Create($webConfigPath, $writerSettings)
            try { $document.Save($writer) } finally { $writer.Dispose() }

            [xml]$verified = Get-Content -LiteralPath $webConfigPath -Raw
            $configuredNames = @(
              $verified.configuration.location.'system.webServer'.aspNetCore.environmentVariables.environmentVariable |
                ForEach-Object { $_.name })
            foreach ($requiredName in $runtimeValues.Keys) {
              if ($requiredName -notin $configuredNames) {
                throw "The Google runtime configuration overlay could not be verified."
              }
            }
          }

          Set-GoogleRuntimeConfiguration $env:RELEASE_PUBLISH_PATH
          Set-GoogleRuntimeConfiguration $env:ROLLBACK_PUBLISH_PATH
          Write-Host "Protected Google sign-in and automatic Gmail import configuration was applied to release and rollback payloads."

      - name: Ensure the application pool is running before preflight
        shell: pwsh
        env:
          MONSTER_WEBSITE_NAME: ${{ secrets.MONSTER_SERVER_USERNAME }}
          MONSTER_SERVER_NAME: ${{ secrets.MONSTER_SERVER_COMPUTER_NAME }}
          MONSTER_USERNAME: ${{ secrets.MONSTER_SERVER_USERNAME }}
          MONSTER_PASSWORD: ${{ secrets.MONSTER_SERVER_PASSWORD }}
        run: |
          ./.github/scripts/set-monster-app-pool.ps1 `
            -Mode StartAppPool `
            -WebsiteName $env:MONSTER_WEBSITE_NAME `
            -ServerComputerName $env:MONSTER_SERVER_NAME `
            -ServerUsername $env:MONSTER_USERNAME `
            -ServerPassword $env:MONSTER_PASSWORD

      - name: Verify the live site and rollback identity before mutation
        shell: pwsh
        run: |
          $homeResponse = $null
          for ($attempt = 1; $attempt -le 6; $attempt++) {
            try {
              $homeResponse = Invoke-WebRequest -Uri "$env:PRODUCTION_ORIGIN/" -UseBasicParsing -TimeoutSec 20
              if ($homeResponse.StatusCode -eq 200) { break }
            }
            catch {
              Write-Warning "Live-site preflight attempt $attempt failed: $($_.Exception.Message)"
            }
            Start-Sleep -Seconds 10
          }
          if ($null -eq $homeResponse -or $homeResponse.StatusCode -ne 200) {
            throw "The current production site is not healthy enough to begin deployment."
          }

          $releaseResponse = Invoke-WebRequest -Uri "$env:PRODUCTION_ORIGIN/health/release" -UseBasicParsing -SkipHttpErrorCheck -TimeoutSec 20
          if ($env:BOOTSTRAP_RELEASE -eq "true") {
            if ($releaseResponse.StatusCode -ne 404) {
              throw "Bootstrap is permitted only before the live site exposes a release identity. This environment has already crossed the hardened-release boundary."
            }
            Write-Warning "Approved one-time first-baseline bootstrap: the legacy live site has no release identity endpoint."
            exit 0
          }

          if ($releaseResponse.StatusCode -ne 200) {
            throw "The current production release identity endpoint is unavailable."
          }
          $ready = Invoke-RestMethod -Uri "$env:PRODUCTION_ORIGIN/health/ready" -TimeoutSec 20
          $release = $releaseResponse.Content | ConvertFrom-Json
          $contact = Invoke-WebRequest -Uri "$env:PRODUCTION_ORIGIN/contact" -UseBasicParsing -TimeoutSec 20
          if ($ready.status -ne "Healthy" -or
              $release.commit -ne $env:ROLLBACK_SHA -or
              $release.environment -ne "Production" -or
              $release.securityBaseline -ne "2026-08-release-hardening-v2" -or
              $release.schemaMigration -ne $env:ROLLBACK_SCHEMA_MIGRATION -or
              $contact.StatusCode -ne 200) {
            throw "The selected rollback artifact is not the current healthy, production-hardened release."
          }

      - name: Deploy immutable tested artifact
        id: deploy_release
        continue-on-error: true
        uses: rasmusbuchholdt/simply-web-deploy@026998dd5857dd5f3645cc13ed48335e07d7f94b
        with:
          website-name: ${{ secrets.MONSTER_SERVER_USERNAME }}
          server-computer-name: ${{ secrets.MONSTER_SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.MONSTER_SERVER_USERNAME }}
          server-password: ${{ secrets.MONSTER_SERVER_PASSWORD }}
          source-path: ${{ env.RELEASE_DEPLOY_PATH }}
          target-delete: true

      - name: Recover application pool after a failed release deployment
        if: ${{ always() && steps.deploy_release.outcome == 'failure' }}
        shell: pwsh
        env:
          MONSTER_WEBSITE_NAME: ${{ secrets.MONSTER_SERVER_USERNAME }}
          MONSTER_SERVER_NAME: ${{ secrets.MONSTER_SERVER_COMPUTER_NAME }}
          MONSTER_USERNAME: ${{ secrets.MONSTER_SERVER_USERNAME }}
          MONSTER_PASSWORD: ${{ secrets.MONSTER_SERVER_PASSWORD }}
        run: |
          ./.github/scripts/set-monster-app-pool.ps1 `
            -Mode StartAppPool `
            -WebsiteName $env:MONSTER_WEBSITE_NAME `
            -ServerComputerName $env:MONSTER_SERVER_NAME `
            -ServerUsername $env:MONSTER_USERNAME `
            -ServerPassword $env:MONSTER_PASSWORD

      - name: Verify deployed version and readiness
        id: verify_release
        if: ${{ always() && (steps.deploy_release.outcome == 'success' || steps.deploy_release.outcome == 'failure') }}
        continue-on-error: true
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 8; $attempt++) {
            try {
              $ready = Invoke-RestMethod -Uri "$env:PRODUCTION_ORIGIN/health/ready" -TimeoutSec 20
              $release = Invoke-RestMethod -Uri "$env:PRODUCTION_ORIGIN/health/release" -TimeoutSec 20
              $contact = Invoke-WebRequest -Uri "$env:PRODUCTION_ORIGIN/contact" -UseBasicParsing -TimeoutSec 20
              if ($ready.status -eq "Healthy" -and
                  $release.commit -eq $env:RELEASE_SHA -and
                  $release.environment -eq "Production" -and
                  $release.securityBaseline -eq "2026-08-release-hardening-v2" -and
                  $release.schemaMigration -eq $env:RELEASE_SCHEMA_MIGRATION -and
                  $contact.StatusCode -eq 200) {
                Write-Host "Verified release $($release.commit) at $env:PRODUCTION_ORIGIN."
                exit 0
              }
            }
            catch {
              Write-Warning "Release verification attempt $attempt failed: $($_.Exception.Message)"
            }
            Start-Sleep -Seconds 10
          }
          throw "The deployed site never reported the expected release, schema readiness, and contact route."

      - name: Roll back application binary
        id: deploy_rollback
        if: ${{ always() && (steps.deploy_release.outcome == 'failure' || steps.verify_release.outcome == 'failure') }}
        continue-on-error: true
        uses: rasmusbuchholdt/simply-web-deploy@026998dd5857dd5f3645cc13ed48335e07d7f94b
        with:
          website-name: ${{ secrets.MONSTER_SERVER_USERNAME }}
          server-computer-name: ${{ secrets.MONSTER_SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.MONSTER_SERVER_USERNAME }}
          server-password: ${{ secrets.MONSTER_SERVER_PASSWORD }}
          source-path: ${{ env.ROLLBACK_DEPLOY_PATH }}
          target-delete: true

      - name: Recover application pool after a failed rollback deployment
        if: ${{ always() && steps.deploy_rollback.outcome == 'failure' }}
        shell: pwsh
        env:
          MONSTER_WEBSITE_NAME: ${{ secrets.MONSTER_SERVER_USERNAME }}
          MONSTER_SERVER_NAME: ${{ secrets.MONSTER_SERVER_COMPUTER_NAME }}
          MONSTER_USERNAME: ${{ secrets.MONSTER_SERVER_USERNAME }}
          MONSTER_PASSWORD: ${{ secrets.MONSTER_SERVER_PASSWORD }}
        run: |
          ./.github/scripts/set-monster-app-pool.ps1 `
            -Mode StartAppPool `
            -WebsiteName $env:MONSTER_WEBSITE_NAME `
            -ServerComputerName $env:MONSTER_SERVER_NAME `
            -ServerUsername $env:MONSTER_USERNAME `
            -ServerPassword $env:MONSTER_PASSWORD

      - name: Verify rollback and fail deployment
        if: ${{ always() && (steps.deploy_release.outcome == 'failure' || steps.verify_release.outcome == 'failure') }}
        shell: pwsh
        env:
          INPUT_DATABASE_BACKUP_REFERENCE: ${{ inputs.database_backup_reference }}
        run: |
          for ($attempt = 1; $attempt -le 6; $attempt++) {
            try {
              $ready = Invoke-RestMethod -Uri "$env:PRODUCTION_ORIGIN/health/ready" -TimeoutSec 20
              $release = Invoke-RestMethod -Uri "$env:PRODUCTION_ORIGIN/health/release" -TimeoutSec 20
              $contact = Invoke-WebRequest -Uri "$env:PRODUCTION_ORIGIN/contact" -UseBasicParsing -TimeoutSec 20
              if ($ready.status -eq "Healthy" -and
                  $release.commit -eq $env:ROLLBACK_SHA -and
                  $release.environment -eq "Production" -and
                  $release.securityBaseline -eq "2026-08-release-hardening-v2" -and
                  $release.schemaMigration -eq $env:ROLLBACK_SCHEMA_MIGRATION -and
                  $contact.StatusCode -eq 200) {
                throw "Release verification failed. Application binary was rolled back to $env:ROLLBACK_SHA. Restore database backup '$env:INPUT_DATABASE_BACKUP_REFERENCE' only if the reviewed migration requires it."
              }
            }
            catch {
              if ($_.Exception.Message -like "Release verification failed.*") { throw }
            }
            Start-Sleep -Seconds 10
          }
          throw "Release verification failed and rollback could not be verified. Use backup '$env:INPUT_DATABASE_BACKUP_REFERENCE' and the Monster recovery runbook immediately."

      - name: Record deployment evidence
        if: ${{ always() && steps.deploy_release.outcome == 'success' && steps.verify_release.outcome == 'success' }}
        shell: pwsh
        env:
          INPUT_RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          INPUT_ROLLBACK_RUN_ID: ${{ inputs.rollback_run_id }}
          INPUT_DATABASE_BACKUP_REFERENCE: ${{ inputs.database_backup_reference }}
          INPUT_BOOTSTRAP_APPROVAL: ${{ inputs.bootstrap_approval_reference }}
        run: |
          $backupReference = $env:INPUT_DATABASE_BACKUP_REFERENCE.Replace("`r", " ").Replace("`n", " ")
          $bootstrapApproval = $env:INPUT_BOOTSTRAP_APPROVAL.Replace("`r", " ").Replace("`n", " ")
          if ([string]::IsNullOrWhiteSpace($bootstrapApproval)) { $bootstrapApproval = "not used" }
          @"
          ## ApplyWise production deployment
          - Release commit: $env:RELEASE_SHA
          - Tested workflow run: $env:INPUT_RELEASE_RUN_ID
          - Rollback workflow run: $env:INPUT_ROLLBACK_RUN_ID
          - Database backup: $backupReference
          - Origin: $env:PRODUCTION_ORIGIN
          - Release migration: $env:RELEASE_SCHEMA_MIGRATION
          - Migration SHA-256: $env:RELEASE_MIGRATION_SHA256
          - Publish payload SHA-256: $env:RELEASE_PAYLOAD_SHA256
          - Bootstrap approval: $bootstrapApproval
